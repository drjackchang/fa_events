<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壯闊台灣活動報名系統（原型）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Sans&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  /* 取自 forward.org.tw：深夜藍主調、鋼藍輔色、捐款按鈕的酒紅作為唯一強調色 */
  --navy:#0E1A25; --navy2:#233E58; --steel:#5A90B3; --steel-l:#E8F0F6;
  --crim:#9E154E; --crim-l:#F8E9EF;
  --paper:#F6F7F8; --card:#FFFFFF; --line:#E3E5E8; --line2:#CDD2D8;
  --text:#0B1118; --muted:#646B75;
  --ok:#2C7A4B; --ok-l:#E6F2EA; --warn:#9A5B00; --warn-l:#FBF1DE; --bad:#B42318; --bad-l:#FBE8E6;
  --f-disp:"Hedvig Letters Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:6px;
  color-scheme:light;
  /* layout: 前台＝報紙式活動列表＋右側報名欄；後台＝左側功能列＋工作區 */
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;line-height:1.3;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--navy2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

/* demo bar */
.demobar{background:#05090D;color:#C9D3DC;font-size:13px;display:flex;align-items:center;gap:14px;padding:6px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:60}
.demobar .lab{border:1px solid #3A4654;padding:1px 8px;border-radius:3px;letter-spacing:.05em}
.demobar nav{display:flex;gap:2px;background:#141C25;border-radius:5px;padding:2px}
.demobar nav button{background:none;border:0;color:#AEB9C4;padding:4px 12px;border-radius:4px}
.demobar nav button.on{background:#fff;color:var(--navy);font-weight:700}
.demobar .clock{margin-left:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;padding:8px 16px;border-radius:var(--r);font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--navy2)}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}
.btn.pri:hover{background:var(--navy)}
.btn.crim{background:var(--crim);border-color:var(--crim);color:#fff;border-radius:999px}
.btn.steel{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--steel-l)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:16px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:#E9B8B2}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* pills */
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;font-weight:500;border:1px solid transparent;white-space:nowrap;line-height:1.7}
.p-ok{background:var(--ok-l);color:var(--ok)}
.p-warn{background:var(--warn-l);color:var(--warn)}
.p-bad{background:var(--bad-l);color:var(--bad)}
.p-info{background:var(--steel-l);color:var(--navy2)}
.p-crim{background:var(--crim-l);color:var(--crim)}
.p-mute{background:#EEF0F2;color:var(--muted)}
.p-line{border-color:var(--line2);color:var(--muted)}

/* public header */
.ph{background:var(--navy);color:#fff}
.ph .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo b{font-family:var(--f-body);font-weight:900;font-size:19px;letter-spacing:.06em;display:block;line-height:1.1}
.logo small{font-size:8.5px;letter-spacing:.24em;opacity:.8;display:block}
.pnav{display:flex;gap:4px;margin-left:8px}
.pnav button{background:none;border:0;color:#C6D2DD;padding:8px 12px;border-radius:4px}
.pnav button.on,.pnav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.ph .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.ph .me{font-size:13px;color:#C6D2DD}
.mnav{display:none}

.band{background:var(--navy);color:#fff;border-top:1px solid #1C2B39}
.band .wrap{padding-top:36px;padding-bottom:36px;display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end}
.band h1{font-size:34px;font-weight:800;letter-spacing:.02em}
.band p{color:#B8C6D3;margin-top:10px;max-width:34em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-left:1px solid #2A3B4C}
.stats div{padding:4px 16px;border-right:1px solid #2A3B4C}
.stats b{display:block;font-family:var(--f-disp);font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:#97A8B8}

/* events list */
.elayout{display:grid;grid-template-columns:220px 1fr;gap:36px;padding-top:32px;padding-bottom:60px}
.filt h4{font-size:12px;letter-spacing:.12em;color:var(--muted);font-family:var(--f-body);font-weight:500;margin:0 0 8px}
.filt .grp{margin-bottom:24px;display:flex;flex-direction:column;gap:2px}
.filt button.f{background:none;border:0;text-align:left;padding:6px 10px;border-radius:4px;display:flex;justify-content:space-between;color:var(--text)}
.filt button.f.on{background:var(--navy2);color:#fff}
.filt button.f:not(.on):hover{background:#EBEEF1}
.codebox{border:1px dashed var(--line2);padding:14px;border-radius:var(--r);background:#fff}
.codebox p{font-size:13px;color:var(--muted);margin-bottom:8px}
.codebox .row{display:flex;gap:6px}
.codebox input{min-width:0;flex:1}
.elist-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--text);padding-bottom:8px;margin-bottom:4px}
.elist-h h2{font-size:22px}
.erow{display:grid;grid-template-columns:92px 1fr 220px;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.erow:hover h3{color:var(--crim)}
.edate{border-right:1px solid var(--line);padding-right:16px;text-align:center}
.edate .m{font-size:13px;color:var(--muted);display:block}
.edate b{font-family:var(--f-disp);font-size:40px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.edate .w{font-size:13px;color:var(--muted)}
.emain .meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.emain h3{font-size:19px;margin:6px 0 4px;transition:color .15s}
.emain p{color:var(--muted);font-size:14px}
.eside{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.price{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.price small{display:block;font-family:var(--f-body);font-size:12px;color:var(--crim)}
.seat{width:100%}
.bar{height:5px;background:#E6E9EC;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--steel)}
.bar.hot i{background:var(--crim)}
.bar.okb i{background:var(--ok)}
.seat span{font-size:12px;color:var(--muted)}

/* event detail */
.ehero{background:var(--navy);color:#fff}
.ehero .wrap{padding-top:22px;padding-bottom:30px}
.crumb{background:none;border:0;color:#9FB2C4;padding:0;font-size:13px;margin-bottom:14px}
.ehero h1{font-size:30px;font-weight:800;max-width:24em}
.facts{display:grid;grid-template-columns:repeat(4,auto);gap:0;margin-top:22px;border-top:1px solid #2A3B4C;width:fit-content;max-width:100%}
.facts div{padding:12px 28px 0 0}
.facts dt{font-size:12px;color:#8FA3B6}
.facts dd{margin:0;font-weight:500}
.dlay{display:grid;grid-template-columns:1fr 340px;gap:44px;padding-top:36px;padding-bottom:70px;align-items:start}
.sec{margin-bottom:34px}
.sec h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.sec ul{margin:0;padding-left:1.2em}
.sec li{margin:4px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:#F8FAFB}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.who{display:flex;gap:14px;flex-wrap:wrap}
.who div{display:flex;gap:10px;align-items:center;min-width:200px}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.av.v{background:var(--steel)}
.av.s{width:28px;height:28px;font-size:12px}
.book{position:sticky;top:52px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy2);border-radius:var(--r);padding:20px}
.tier{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tier.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2)}
.tier input{margin-right:8px}
.tier .n{font-variant-numeric:tabular-nums;font-weight:700}
.tier.dis{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.note{font-size:13px;color:var(--muted);background:#F3F5F7;padding:10px 12px;border-radius:var(--r)}
.note.warn{background:var(--warn-l);color:#6B4300}
.note.ok{background:var(--ok-l);color:#1D5535}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.form .full{grid-column:1/-1}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.fld label i{color:var(--crim);font-style:normal}
.fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;background:#fff}
textarea{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:12px;margin-top:3px}
.steps{display:flex;gap:0;margin:24px 0 26px;border-bottom:1px solid var(--line)}
.steps div{padding:10px 18px 10px 0;margin-right:18px;color:var(--muted);font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.steps div.on{color:var(--text);border-color:var(--crim);font-weight:700}
.steps div.done{color:var(--ok)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.radio{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.radio.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2)}

/* ticket */
.ticket{display:grid;grid-template-columns:1fr 170px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ticket .l{padding:20px 22px;border-right:2px dashed var(--line2)}
.ticket .r{padding:16px;display:grid;place-items:center;text-align:center;background:#FBFCFD}
.ticket .r svg{width:132px;height:132px;display:block}
.ticket h3{font-size:18px;margin:4px 0 10px}
.ticket .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.msgprev{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.msgprev .hd{background:#F3F5F7;padding:8px 12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.msgprev .bd{padding:12px 14px;font-size:14px;white-space:pre-line}
.line-bubble{background:#E9F6EC;border-radius:14px 14px 14px 4px;padding:10px 12px;white-space:pre-line;font-size:14px;max-width:340px}

/* stories */
.story{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:28px 0;border-bottom:1px solid var(--line)}
.story h3{font-size:20px;margin:4px 0 8px}
.ph-grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:120px;gap:6px}
.ph-grid img{width:100%;height:100%;object-fit:cover;border-radius:3px;cursor:zoom-in;display:block}
.ph-grid img:first-child{grid-row:span 2}

/* faq */
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;padding:12px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq .a{padding:0 0 14px;color:#38414B;font-size:14px}
.faq .cat{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:26px 0 4px}

/* chat */
.chatbtn{position:fixed;right:20px;bottom:20px;z-index:50;background:var(--navy2);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px rgba(14,26,37,.25);display:flex;gap:8px;align-items:center}
.chatbtn .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80}
.chat{position:fixed;right:20px;bottom:76px;width:360px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100% - 140px);background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px rgba(14,26,37,.22);z-index:51;display:flex;flex-direction:column;overflow:hidden}
.chat .hd{background:var(--navy);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.chat .hd small{display:block;color:#9FB2C4;font-size:12px}
.chat .bd{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#F6F7F8}
.bub{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;white-space:pre-line}
.bub.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.bub.staff{background:var(--steel-l);align-self:flex-start;border-bottom-left-radius:3px}
.bub.me{background:var(--navy2);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.bub .who{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.chips button:hover{border-color:var(--navy2)}
.chat form{display:flex;border-top:1px solid var(--line);padding:8px;gap:6px}
.chat form input{flex:1;border:1px solid var(--line2);border-radius:999px;padding:8px 12px}

/* app (admin & staff) */
.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100% - 34px)}
.side{background:var(--navy);color:#C6D2DD;padding:18px 12px;position:sticky;top:34px;height:calc(100vh - 34px);overflow-y:auto}
.side .logo{padding:0 8px 18px;border-bottom:1px solid #22313F;margin-bottom:12px;width:100%}
.side .grp{font-size:11px;letter-spacing:.14em;color:#6E8195;margin:16px 10px 6px}
.side button.nv{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:#C6D2DD;padding:8px 10px;border-radius:5px;text-align:left;font-size:14px}
.side button.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.side button.nv.on{background:#fff;color:var(--navy);font-weight:700}
.side .cnt{background:var(--crim);color:#fff;font-size:11px;border-radius:999px;padding:0 7px;font-weight:700}
.main{padding:26px 32px 70px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.mh h1{font-size:24px}
.mh p{color:var(--muted);font-size:14px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px}
.kpis div{padding:14px 18px;border-right:1px solid var(--line)}
.kpis div:last-child{border-right:0}
.kpis span{font-size:12px;color:var(--muted);display:block}
.kpis b{font-family:var(--f-disp);font-size:26px;font-variant-numeric:tabular-nums;display:block;line-height:1.3}
.kpis em{font-style:normal;font-size:12px;color:var(--ok)}
.g2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.box>h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.todo{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.todo:last-child{border-bottom:0}
.todo .sv{width:4px;align-self:stretch;border-radius:2px;flex:none}
.todo .sv.bad{background:var(--bad)} .todo .sv.warn{background:#D99A1E} .todo .sv.info{background:var(--steel)}
.todo .tx{flex:1;font-size:14px}
.todo .tx small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line2);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--navy2);font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:240px}
.toolbar select{width:auto}
.role-blk{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:#fff}
.role-blk .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;gap:8px;flex-wrap:wrap}
.role-blk .row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #F0F1F3;flex-wrap:wrap}
.role-blk .row:last-child{border-bottom:0}
.role-blk .row .nm{flex:1;min-width:140px}
.slots{display:flex;gap:3px}
.slots i{width:14px;height:14px;border-radius:3px;background:#E6E9EC;display:block}
.slots i.f{background:var(--ok)}
.slots i.p{background:#E8C46A}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:3px;background:#EEF1F4;color:#3D4752;margin:1px 2px 1px 0}
.scan{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px;display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.scan .vf{aspect-ratio:1;border:2px solid #3E5872;border-radius:8px;position:relative;display:grid;place-items:center;color:#7F95AA;font-size:13px;text-align:center;overflow:hidden}
.scan .vf::before{content:"";position:absolute;left:10%;right:10%;height:2px;background:#4ADE80;top:20%;animation:sweep 2.2s ease-in-out infinite;box-shadow:0 0 12px #4ADE80}
@keyframes sweep{50%{top:78%}}
@media (prefers-reduced-motion:reduce){.scan .vf::before{animation:none}}
.scanres{border-radius:var(--r);padding:14px 16px;margin-top:12px;font-weight:500}
.scanres.ok{background:#1E5E3A;color:#fff}
.scanres.bad{background:#7A1F17;color:#fff}
.scanres.warn{background:#6B4A0A;color:#fff}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.hb{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hb .bar{height:10px}

/* QR：優先用 qrcode-generator，若 CDN 無法載入則以雜湊圖樣代替（原型用） */
function qr(text){
  let n,dark;
  try{const q=qrcode(0,'M');q.addData(text);q.make();n=q.getModuleCount();dark=(r,c)=>q.isDark(r,c)}
  catch(e){n=25;let h=0;for(const ch of text)h=(h*31+ch.charCodeAt(0))|0;const rr=rng(h);const g=[...Array(n)].map(()=>[...Array(n)].map(()=>rr()>.52));
    const fp=(y,x)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++)g[y+i][x+j]=(i===0||i===6||j===0||j===6||(i>1&&i<5&&j>1&&j<5));for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const Y=y+i,X=x+j;if(Y>=0&&X>=0&&Y<n&&X<n&&(i===-1||i===7||j===-1||j===7))g[Y][X]=false}};
    fp(0,0);fp(0,n-7);fp(n-7,0);dark=(r,c)=>g[r][c]}
  let p='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(dark(r,c))p+=`M${c+2} ${r+2}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="報到 QR Code"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#0E1A25"/></svg>`;
}

function conflict(pid,e){return S.events.some(x=>x.id!==e.id&&x.date===e.date&&x.staff.some(s=>s.pid===pid&&s.st==='confirmed'))}
function qualifies(p,role){return role==='vol'||p.kind==='教官'||(role==='assist'&&p.skills.some(s=>/EMT|CPR|止血|Meshtastic|搜救/.test(s)))}
function openSlotsFor(p){
  const out=[];for(const e of S.events){if(phase(e)!=='open'&&phase(e)!=='closed')continue;if(e.date<TODAY||e.staff.some(s=>s.pid===p.id&&s.st!=='declined'))continue;
    for(const role in e.roles){const gap=e.roles[role]-staffCount(e,role);if(gap>0&&qualifies(p,role)){out.push({e,role,gap});break}}}
  return out.sort((a,b)=>a.e.date.localeCompare(b.e.date));
}

function count(arr,f){const o={};arr.forEach(x=>{const k=f(x)||'未填';o[k]=(o[k]||0)+1});return o}
function hbars(o,u=''){const m=Math.max(...Object.values(o),1);return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><span class="num" style="text-align:right">${v.toLocaleString()}${u?' '+u:''}</span></div>`).join('')}

function autoPromote(e){let p=null;while(left(e)>0){const w=regsOf(e.id,'waitlist')[0];if(!w)break;w.st='confirmed';w.pay=e.tiers[w.tier].p?'unpaid':'free';notify('候補遞補通知',w.name,e.id);p=p||w}return p}

function scrollChat(){const b=document.getElementById('chatbd');if(b)b.scrollTop=b.scrollHeight}
function chatSend(q){
  const now=Date.now();S.chatTs=(S.chatTs||[]).filter(t=>now-t<60000);
  if(S.chatTs.length>=5){S.chat.push({from:'bot',x:'訊息傳送太頻繁，請等一分鐘再試。'});render();scrollChat();return}
  S.chatTs.push(now);
  if(/[A-Z][12]\d{8}/i.test(q)||/09\d{2}[-\s]?\d{3}[-\s]?\d{3}/.test(q)){S.chat.push({from:'bot',x:'這則訊息看起來含有身分證字號或手機號碼。為了保護你的個資，我先攔下沒有送出，請刪掉這些資料再傳一次。'});render();scrollChat();return}
  S.chat.push({from:'me',x:q});const f=faqMatch(q);
  if(f)S.chat.push({from:'bot',x:f.a,fb:true});
  else{escalate(q,true);return}
  render();scrollChat();
}
function escalate(q,auto){
  const em=S.me.authed?S.me.email:'';
  S.inq.unshift({id:uid('Q'),name:S.me.authed?S.me.name:'訪客',email:em||'（未登入，只在視窗回覆）',q,t:nowStamp(),st:'open',re:[],eid:S.pub.eid});
  S.chat.push({from:'bot',x:`${auto?'這個問題我沒有把握回答正確，':''}已轉給工作人員。回覆會出現在這個視窗${em?`，也會寄到 ${maskEmail(em)}`:'；想收到 Email 回覆的話，請先登入'}。`});
  render();scrollChat();
}
function blurImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=im.naturalWidth||400;c.height=im.naturalHeight||300;const x=c.getContext('2d');if(!('filter' in x))throw new Error('no filter');x.filter='blur(14px)';x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))}catch(err){rej(err)}};im.onerror=rej;im.src=src})}
/* 重新編碼圖片：瀏覽器端先移除 EXIF（正式版伺服器端會再處理一次） */
function reencode(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
function pickStaffModal(eid,role){
  const e=evt(eid);
  const cands=S.people.filter(p=>qualifies(p,role)&&!e.staff.some(s=>s.pid===p.id&&s.role===role)).map(p=>{
    let sc=0,why=[];if(p.city===e.city){sc+=3;why.push('同地區')}if(/週末/.test(p.avail)&&[0,6].includes(d2(e.date).getDay())){sc+=1;why.push('週末可')}
    const sk=p.skills.filter(s=>(e.title+e.learn.join('')).includes(s.replace(/[-\/].*/,''))||(/止血|Stop/.test(e.title)&&/止血|EMT/.test(s))||(/Meshtastic|通訊/.test(e.title)&&/Meshtastic|無線電/.test(s))||(/搜救|災害/.test(e.title)&&/搜救|EMT|ICS/.test(s)));if(sk.length){sc+=2*sk.length;why.push('專長相符')}
    if(p.hours<35){sc+=1;why.push('近期出勤少')}const cf=conflict(p.id,e);if(cf){sc-=10;why.push('同日已有排班')}
    const exp=p.certs.find(c=>c.exp<e.date);if(exp)why.push(`${exp.n} 已過期`);
    return{p,sc,why,cf}}).sort((a,b)=>b.sc-a.sc);
  const need=e.roles[role]-staffCount(e,role);
  openModal(`帶入人選：${ROLE[role]}・${e.title}`,`<p class="small muted" style="margin-bottom:10px">依地區、專長、出勤時段與年度出勤次數排序（讓大家輪流），同日有排班者排在最後。目前缺 ${Math.max(0,need)} 位，已預先勾選建議人選。</p>
   <div class="tw"><table class="t"><thead><tr><th></th><th>姓名</th><th>建議原因</th><th>年度時數</th></tr></thead><tbody>${cands.map((c,i)=>`<tr><td><input type="checkbox" name="pk" value="${c.p.id}" ${i<need&&!c.cf?'checked':''} aria-label="選擇 ${c.p.name}"></td><td><b>${c.p.name}</b> <span class="small muted">${c.p.kind}・${c.p.city}</span></td><td>${c.why.map(w=>`<span class="tag" style="${/過期|同日/.test(w)?'background:var(--bad-l);color:var(--bad)':''}">${w}</span>`).join('')}</td><td class="num">${c.p.hours}</td></tr>`).join('')}</tbody></table></div>
   <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><label class="radio on" style="flex:1;min-width:220px"><input type="radio" name="pmode" value="asked" checked><span><b>意願徵詢</b><br><span class="small muted">先問問，回覆有意願後再正式邀請</span></span></label><label class="radio" style="flex:1;min-width:220px"><input type="radio" name="pmode" value="invited"><span><b>正式邀請</b><br><span class="small muted">直接請對方確認出勤</span></span></label></div>`,
   `<button class="btn" data-act="closeModal">取消</button><button class="btn pri" data-act="sendPick" data-id="${eid}" data-r="${role}">透過 LINE 發送</button>`,true);
}
function eventForm(fromId){
  const src=fromId?evt(fromId):null;
  const v=src?{...src,date:addD(src.date,28),deadline:addD(src.date,24)}:{title:'',type:'公開課',date:addD(TODAY,30),time:'09:00–17:00',hours:7,city:'台北',venue:'',capacity:30,tiers:[{n:'一般',p:1200},{n:'學生',p:800}],summary:'',roles:{lead:1,assist:2,vol:1},refund:'std',deadline:addD(TODAY,26)};
  const past=S.events.filter(e=>e.type!=='專班').map(e=>`<option value="${e.id}" ${fromId===e.id?'selected':''}>${esc(e.title)}</option>`).join('');
  openModal(fromId?'複製成新場次':'建立活動',`<div class="fld" style="margin-bottom:14px"><label for="nf_src">從過去的活動複製（帶入簡介、流程、票價與人力需求）</label><select id="nf_src"><option value="">不複製，從空白開始</option>${past}</select></div>
   <div class="form"><div class="fld full"><label for="nf_t">活動名稱</label><input id="nf_t" type="text" value="${esc(src?src.title:v.title)}"></div>
   <div class="fld"><label for="nf_ty">類型</label><select id="nf_ty">${TYPES.map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="fld"><label for="nf_c">城市</label><select id="nf_c">${['台北','新北','桃園','新竹','台中','台南','高雄','花蓮'].map(x=>`<option ${v.city===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="fld"><label for="nf_d">日期</label><input id="nf_d" type="date" value="${v.date}"></div><div class="fld"><label for="nf_tm">時間</label><input id="nf_tm" type="text" value="${v.time}"></div>
   <div class="fld full"><label for="nf_v">地點</label><input id="nf_v" type="text" value="${esc(v.venue)}"></div>
   <div class="fld"><label for="nf_cap">名額</label><input id="nf_cap" type="number" value="${v.capacity}"></div><div class="fld"><label for="nf_h">時數（證書用）</label><input id="nf_h" type="number" step=".5" value="${v.hours}"></div>
   <div class="fld"><label for="nf_p1">一般票價</label><input id="nf_p1" type="number" value="${v.tiers[0].p}"></div><div class="fld"><label for="nf_p2">學生／優惠票價（0 表示不開放）</label><input id="nf_p2" type="number" value="${v.tiers[1]?.p||0}"></div>
   <div class="fld full"><label>人力需求</label><div style="display:flex;gap:10px;flex-wrap:wrap">${Object.keys(ROLE).map(k=>`<label style="display:flex;gap:6px;align-items:center;font-size:14px">${ROLE[k]}<input type="number" id="nf_r_${k}" value="${v.roles[k]}" min="0" style="width:64px"></label>`).join('')}</div></div>
   <div class="fld full"><label for="nf_s">簡介</label><textarea id="nf_s">${esc(v.summary)}</textarea></div></div>`,
   `<button class="btn" data-act="closeModal">取消</button><button class="btn" data-act="saveEvent" data-st="draft">存成草稿</button><button class="btn pri" data-act="saveEvent" data-st="open">建立並開放報名</button>`,true);
  S._from=fromId||null;
}
function saveEvent(st){
  const g=id=>document.getElementById(id).value;const t=g('nf_t').trim();if(!t){toast('請填活動名稱');return}
  const src=S._from?evt(S._from):null;const p2=+g('nf_p2');
  const e={id:uid('E'),title:t,type:g('nf_ty'),date:g('nf_d'),time:g('nf_tm'),hours:+g('nf_h'),city:g('nf_c'),venue:g('nf_v')||'待定',capacity:+g('nf_cap'),
    tiers:[{n:'一般',p:+g('nf_p1')},...(p2?[{n:'學生',p:p2}]:[])],deadline:addD(g('nf_d'),-4),status:st,summary:g('nf_s')||(src?src.summary:''),learn:src?[...src.learn]:[],bring:src?[...src.bring]:[],sched:src?src.sched.map(x=>[...x]):[],
    roles:{lead:+g('nf_r_lead'),assist:+g('nf_r_assist'),vol:+g('nf_r_vol')},staff:[],photos:[],refund:'std'};
  S.events.push(e);S.jobs.push({id:uid('J'),eid:e.id,tpl:'活動前一天提醒',at:addD(e.date,-1)+' 18:00',done:false});
  closeModal();S.admin.tab='events';S.admin.eid=e.id;S.admin.etab='staff';render();
  toast(st==='open'?'活動已上架。下一步：帶入教官與志工':'已存成草稿');
}

/* ---------------- EVENTS ---------------- */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(!a)return;
  if(t.tagName==='BUTTON'||t.tagName==='A'&&!t.href)ev.preventDefault();
  if(t.dataset.act==='tier'||t.dataset.act==='pm'){} a(t.dataset,t,ev)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.modal)closeModal();if(ev.key==='Enter'&&ev.target.classList.contains('erow'))ACT.openEvent(ev.target.dataset)});
document.addEventListener('submit',ev=>{const f=ev.target;const k=f.dataset.form;if(!k)return;ev.preventDefault();
  if(k==='code'){const P=S.pub;if(P.codeLock&&Date.now()<P.codeLock){toast('嘗試次數過多，請 15 分鐘後再試');return}
    const c=document.getElementById('code').value.trim().toUpperCase();const e=S.events.find(x=>x.code&&x.code===c);
    if(e){P.codeFail=0;ACT.openEvent({id:e.id})}else{P.codeFail=(P.codeFail||0)+1;if(P.codeFail>=5){P.codeLock=Date.now()+15*60e3;P.codeFail=0;audit('專班代碼連續錯誤 5 次，暫停 15 分鐘','前台','系統');toast('嘗試次數過多，已暫停 15 分鐘')}else toast(`代碼不正確，請向單位窗口確認（還可嘗試 ${5-P.codeFail} 次）`)}}
  if(k==='reg'){
    const fd=new FormData(f);const v=Object.fromEntries(fd.entries());v.agree=!!fd.get('agree');v.hf=!!fd.get('hf');S.pub.form={...S.pub.form,...v};
    const e=evt(S.pub.eid),er={};
    if(!v.name?.trim())er.name='請填寫稱呼';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((v.email||'').trim()))er.email='Email 格式不正確';
    if(e.ins){if(!v.lname?.trim())er.lname='投保需要證件上的姓名';if(!/^[A-Z][12A-D89]\d{8}$/i.test((v.nid||'').trim()))er.nid='格式不正確（例：A123456789）';if(!v.birth)er.birth='投保需要出生日期'}
    if(!v.agree)er.agree='請勾選同意';
    if(e.code&&(v.code||'').trim().toUpperCase()!==e.code)er.code='專班代碼不正確';
    S.pub.errs=er;if(Object.keys(er).length){render();const fe=document.querySelector('.err');fe&&fe.scrollIntoView({block:'center'});return}
    /* 保險三欄送往獨立保險名冊後，立即從報名系統的記憶體中清除 */
    const insured=!!e.ins;['lname','nid','birth'].forEach(k=>{delete S.pub.form[k]});
    const dup=S.regs.find(r=>r.eid===e.id&&r.email.toLowerCase()===v.email.trim().toLowerCase()&&['confirmed','waitlist'].includes(r.st));
    if(dup){S.pub.dup=true;S.pub.reg=dup.id;S.pub.step=3;render();scrollTo(0,0);return}
    S.pub.dup=false;
    const t=e.tiers[S.pub.tier||0];const full=left(e)===0;
    const r=mkReg(e,{name:v.name.trim(),email:v.email.trim(),tier:S.pub.tier||0,hf:v.hf,ins:insured,rc:v.rc,src:v.src||'未填',created:TODAY,pay:full?'unpaid':(e.code?'b2b':(t.p>0?'unpaid':'free')),st:full?'waitlist':'confirmed',rcpt:null});
    if(e.code)r.amount=0;
    S.pub.reg=r.id;
    if(full||t.p===0||e.code){S.pub.step=3;if(!full)notify('報名成功',r.name+'（'+maskEmail(r.email)+'）',e.id)}else S.pub.step=2;
    render();scrollTo(0,0);
  }
  if(k==='login'){S.pub.linkSent=true;render()}
  if(k==='chat'){const i=document.getElementById('chatin');const q=i.value.trim();if(q)chatSend(q)}
  if(k==='ckcode'){const A=S.admin;const e=evt(A.ckEid);
    if(A.ckLock&&Date.now()<A.ckLock){A.ckMsg={k:'bad',x:'✕ 錯誤次數過多，代碼輸入暫停 60 秒（掃描不受影響）'};render();return}
    const c=document.getElementById('ckcode').value.trim().toUpperCase();const r=S.regs.find(x=>['confirmed','waitlist','cancelled'].includes(x.st)&&dcode(x)===c);
    if(!r||r.eid!==e.id){A.ckFail=(A.ckFail||0)+1;if(A.ckFail>=5){A.ckLock=Date.now()+60e3;A.ckFail=0;audit('簽到代碼連續錯誤 5 次',e.title,'系統')}A.ckMsg={k:'bad',x:'✕ 本場查無此票券代碼'}}
    else if(r.st!=='confirmed')A.ckMsg={k:'warn',x:`! ${esc(r.name)} 的報名狀態為「${regPill(r,e)[0]}」，請至服務台處理`};
    else if(r.checkin)A.ckMsg={k:'warn',x:`! ${esc(r.name)} 已於 ${r.checkin.slice(11)} 簽到過`};
    else{A.ckFail=0;r.checkin=e.date+' 13:02';A.ckMsg={k:'ok',x:`✓ ${esc(r.name)}　簽到成功`}}render()}
  if(k==='reply'){const q=S.inq.find(x=>x.id===f.dataset.id);const x=document.getElementById('replytx').value.trim();if(!x){toast('請輸入回覆內容');return}
    q.re.push({by:'楊佳蓉',t:nowStamp(),x});q.st='done';S.admin.draft='';if(q.email===S.me.email)S.chat.push({from:'staff',by:'楊佳蓉',x});notify('詢問回覆',q.name+'（'+maskEmail(q.email)+'）',q.eid);toast('已回覆並寄出 Email');render()}
  if(k==='gw'){S.gw={prov:document.getElementById('gwp').value,test:document.getElementById('gwt').checked,inv:document.getElementById('gwi').checked};toast('金流設定已儲存');render()}
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='fq'){S.pub.fq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('fq');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='pq'){S.admin.peopleQ=t.value;const pos=t.selectionStart;render();const n=document.getElementById('pq');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='rq'){S.admin.rq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('rq');n.focus();n.setSelectionRange(pos,pos)}
  if(t.dataset.cap){evt(t.dataset.cap).photos[+t.dataset.i].cap=t.value}
  if(t.id==='replytx')S.admin.draft=t.value;
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='sme'){S.staff.me=t.value;render()}
  if(t.id==='ckev'){S.admin.ckEid=t.value;S.admin.ckMsg=null;render()}
  if(t.id==='tplsel'){S.admin.tpl=t.value;render()}
  if(t.id==='nf_src'){if(t.value){eventForm(t.value)}}
  if(t.name==='pmode'){document.querySelectorAll('input[name=pmode]').forEach(x=>x.closest('.radio').classList.toggle('on',x.checked))}
  if(t.dataset.okph){evt(t.dataset.okph).photos[+t.dataset.i].ok=t.checked;render()}
  if(t.id==='upl'){const e=evt(t.dataset.id);const fs=[...t.files].slice(0,8);Promise.all(fs.map(reencode)).then(srcs=>{srcs.forEach(s=>e.photos.push({src:s,cap:'',ok:false}));toast(`已上傳 ${srcs.length} 張，已移除 EXIF`);render()}).catch(()=>toast('有檔案無法讀取，請改用 JPG 或 PNG'))}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['public','staff','admin'].includes(h)&&h!==S.view){S.view=h;render()}});
(function init(){const h=location.hash.slice(1);if(['public','staff','admin'].includes(h))S.view=h;render()})();
